<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop · Itinerary Builder</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body>
    <main class="page">
      <div data-topbar></div>
      <section class="panel">
        <div class="panel-header">
          <div>
            <h3 id="trip-title">Build trip</h3>
            <p class="muted">Add stops, attach activities, and reorder the route.</p>
          </div>
        </div>
        <form id="add-stop-form">
          <div class="field-grid-3">
            <label>City <select name="cityId"></select></label>
            <label>Start <input type="date" name="startDate"></label>
            <label>End <input type="date" name="endDate"></label>
          </div>
          <button class="button-primary" type="submit">Add stop</button>
        </form>
      </section>
      <section class="panel" style="margin-top:1rem;">
        <div class="panel-header">
          <div><h3>Tools</h3><p class="muted">Branch into the other trip planning screens.</p></div>
        </div>
        <div class="inline-actions" id="builder-links"></div>
      </section>
      <div id="stop-list" style="margin-top:1rem;"></div>
    </main>
    <script type="module" src="/assets/js/pages/itinerary-builder.js"></script>
  </body>
  </html>

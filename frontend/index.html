<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop · Login</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body>
    <main class="page auth-grid">
      <section class="auth-poster">
        <div class="login-poster-image">
          <img class="login-poster-photo" src="/images/login.png" alt="Traveloop login visual">
        </div>
      </section>
      <section class="auth-form">
        <div class="split-toggle">
          <button class="active" data-mode="login" type="button">Login</button>
          <button data-mode="signup" type="button">Signup</button>
        </div>
        <h2 id="auth-title">Welcome back</h2>
        <p class="muted">Use any name and email to enter the prototype.</p>
        <form id="auth-form">
          <label>Name <input name="name" value="Maya" required></label>
          <label>Email <input type="email" name="email" value="maya@traveloop.test" required></label>
          <label>Password <input type="password" name="password" value="password"></label>
          <button class="button-primary" type="submit">Enter Traveloop</button>
        </form>
        <p class="footer-note">No real auth yet. This is a motion-and-flow prototype.</p>
      </section>
    </main>
    <script type="module" src="/assets/js/pages/login.js"></script>
  </body>
  </html>

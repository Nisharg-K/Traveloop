<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop · Login</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body>
    <main class="page auth-grid">
      <section class="auth-poster">
        <div class="login-poster-image" aria-label="Traveloop travel mockup illustration">
          <div class="poster-stamp">TRAVELOOP</div>
          <div class="poster-window">
            <div class="poster-browser-bar">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="poster-dashboard">
              <aside class="poster-sidebar">
                <div class="poster-mini-logo">TL</div>
                <div class="poster-nav-pill active"></div>
                <div class="poster-nav-pill"></div>
                <div class="poster-nav-pill"></div>
                <div class="poster-nav-pill short"></div>
              </aside>
              <div class="poster-main">
                <div class="poster-banner"></div>
                <div class="poster-cards">
                  <div class="poster-card coral"></div>
                  <div class="poster-card teal"></div>
                  <div class="poster-card yellow"></div>
                </div>
                <div class="poster-split">
                  <div class="poster-panel">
                    <div class="poster-line wide"></div>
                    <div class="poster-line"></div>
                    <div class="poster-line short"></div>
                    <div class="poster-chip-row">
                      <span></span>
                      <span></span>
                      <span></span>
                    </div>
                  </div>
                  <div class="poster-panel alt">
                    <div class="poster-map">
                      <i class="dot a"></i>
                      <i class="dot b"></i>
                      <i class="dot c"></i>
                      <svg viewBox="0 0 240 130" aria-hidden="true">
                        <path d="M20 95 C60 30, 110 125, 150 58 S220 42, 220 82" />
                      </svg>
                    </div>
                  </div>
                </div>
                <div class="poster-footer-row">
                  <div class="poster-ticket"></div>
                  <div class="poster-ticket small"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="auth-form">
        <div class="split-toggle">
          <button class="active" data-mode="login" type="button">Login</button>
          <button data-mode="signup" type="button">Signup</button>
        </div>
        <h2 id="auth-title">Welcome back</h2>
        <p class="muted">Use any name and email to enter the prototype.</p>
        <form id="auth-form">
          <label>Name <input name="name" value="Maya" required></label>
          <label>Email <input type="email" name="email" value="maya@traveloop.test" required></label>
          <label>Password <input type="password" name="password" value="password"></label>
          <button class="button-primary" type="submit">Enter Traveloop</button>
        </form>
        <p class="footer-note">No real auth yet. This is a motion-and-flow prototype.</p>
      </section>
    </main>
    <script type="module" src="/assets/js/pages/login.js"></script>
  </body>
  </html>
